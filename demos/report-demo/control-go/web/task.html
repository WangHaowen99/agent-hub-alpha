<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>年报协作 · 可信确认</title><style>body{max-width:1100px;margin:32px auto;padding:0 24px;background:#f5f7fb;color:#1b2b42;font:15px/1.65 system-ui,sans-serif}h1{font-size:28px}section{padding:22px;background:white;border:1px solid #dce4ef;border-radius:14px;margin:18px 0}input,button{font:inherit;padding:9px 12px;border:1px solid #b5c3d8;border-radius:7px;margin:4px}button{background:#275ba5;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#error{color:#ae3030}small{color:#61728a}.toolbar{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><small>REPORT DEMO / 可信用户入口</small><h1>核对计划，再确认执行</h1><p>确认绑定下面的任务、图版本和摘要。模型无法代替你批准。</p><section id="login"><form id="login-form"><label>账号 <input id="user" autocomplete="username" value="demo" required></label><label>密码 <input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section><p id="error" role="alert"></p><section><h2 id="status">登录后读取任务</h2><p id="goal"></p><pre id="digest"></pre><div class="toolbar"><button id="admit" disabled>确认采纳这份计划</button><button id="pause" disabled>暂停新节点</button><button id="resume" disabled>继续</button><button id="refresh">刷新</button></div></section><section><h2>图、产物与当前有效性</h2><div id="nodes"></div></section><section><h2>调用关联与审计事件</h2><pre id="events"></pre></section><script>
/* PROJECTION_GUARD */

const id=location.pathname.split('/').pop();let csrf=sessionStorage.getItem('report-csrf')||'',task;const projection=new ReportProjection(id);let refreshSequence=0;
const reports=document.createElement('section');reports.append(elem('h2','核验与交付报告'));const reportList=document.createElement('div');reports.append(reportList);document.body.insertBefore(reports,document.querySelector('script'));
function elem(tag,value){const e=document.createElement(tag);e.textContent=value;return e}
async function api(path,body){const res=await fetch(path,{method:body===undefined?'GET':'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body===undefined?undefined:JSON.stringify(body)});const v=await res.json();if(!res.ok)throw Error(v.error?.code+'：'+v.error?.message);return v}
async function refresh(){const sequence=++refreshSequence;try{const snapshot=await api('/v1/tasks/'+id);if(!projection.accept(snapshot))return;task=snapshot;document.getElementById('error').textContent='';document.getElementById('status').textContent=task.status+(task.pause_requested?' / 已请求暂停':'');document.getElementById('goal').textContent=task.graph.goal;document.getElementById('digest').textContent=`任务 ${task.task_id}\n图 ${task.graph_revision}\n采纳摘要 ${task.graph_digest}\n编译摘要 ${task.runtime_spec_digest}`;document.getElementById('admit').disabled=task.status!=='AWAITING_APPROVAL'||!csrf;document.getElementById('pause').disabled=!csrf;document.getElementById('resume').disabled=!csrf;const root=document.getElementById('nodes');root.replaceChildren();for(const n of task.graph.nodes){const d=document.createElement('details');const state=task.nodes[n.id];d.append(elem('summary',`${n.role} / ${n.id} / ${state.status}`),elem('pre',JSON.stringify({plan:n,state},null,2)));root.append(d)}const events=await api('/v1/tasks/'+id+'/events');if(sequence===refreshSequence)document.getElementById('events').textContent=JSON.stringify(events,null,2)}catch(e){document.getElementById('error').textContent=e.message}}
document.getElementById('login-form').onsubmit=async event=>{event.preventDefault();try{const v=await api('/auth/login',{user:document.getElementById('user').value,password:document.getElementById('password').value});csrf=v.csrf;sessionStorage.setItem('report-csrf',csrf);document.getElementById('password').value='';await refresh()}catch(e){document.getElementById('error').textContent=e.message}};
for(const action of ['admit','pause','resume'])document.getElementById(action).onclick=async()=>{try{await projection.runCommand('task-command',()=>api(`/v1/tasks/${id}/${action}`,action==='admit'?{graph_digest:task.graph_digest}:{}));await refresh()}catch(e){document.getElementById('error').textContent=e.message}};
async function refreshReports(){if(!task)return;reportList.replaceChildren();for(const n of task.graph.nodes){const state=task.nodes[n.id];if(!state.result||(!state.result.output?.indicators||!state.result.output?.scope)||!state.result.valid)continue;const artifact=state.result.artifact_id;const row=document.createElement('div');row.append(elem('h3',n.id),elem('pre',JSON.stringify(state.result,null,2)));for(const action of ['approve','deliver']){const b=elem('button',action==='approve'?'验收此版本':'确认交付此版本');b.disabled=!csrf||!['AWAITING_ACCEPTANCE','DELIVERED'].includes(task.status);b.onclick=async()=>{try{const receipt=await projection.runCommand(`artifact-${artifact}`,()=>api(`/v1/tasks/${id}/artifacts/${artifact}/${action}`,action==='deliver'?{delivery_id:`ui-${id}-${artifact}`}:{ }));row.append(elem('pre',JSON.stringify(receipt,null,2)));await refresh()}catch(e){document.getElementById('error').textContent=e.message}};row.append(b)}const download=elem('a','下载已交付 JSON');download.href=`/v1/tasks/${id}/artifacts/${artifact}/download`;row.append(download);reportList.append(row)}}
const reviews=document.createElement('section');reviews.append(elem('h2','待人工核验的检查'));const reviewList=document.createElement('div');reviews.append(reviewList);document.body.insertBefore(reviews,reports);
function refreshReviews(){reviewList.replaceChildren();if(!task)return;for(const [node,ns] of Object.entries(task.nodes)){const check=ns.result?.output;if(check?.outcome!=='HUMAN'||!ns.result.valid)continue;const row=document.createElement('div');row.append(elem('h3',node),elem('pre',JSON.stringify({checker:check,checker_artifact:ns.result.artifact_id,review:ns.review||null},null,2)));if(!ns.review){const reason=document.createElement('textarea');reason.placeholder='写明实际审阅依据、逐项判断及范围（至少12字符）；这不会把程序 HUMAN 改写为程序 PASS';reason.rows=5;reason.style.width='100%';row.append(reason);for(const decision of ['ACCEPT','REVISE','REJECT']){const b=elem('button',({ACCEPT:'人工核验接受',REVISE:'要求定向修订',REJECT:'拒绝该报告'})[decision]);b.disabled=!csrf;b.onclick=async()=>{try{await projection.runCommand(`review-${node}`,()=>api(`/v1/tasks/${id}/checks/${node}/review`,{check_artifact:ns.result.artifact_id,object_digest:check.object_digest,decision,reason:reason.value}));await refresh()}catch(e){document.getElementById('error').textContent=e.message}};row.append(b)}}reviewList.append(row)}}
const originalRefresh=refresh;refresh=async()=>{await originalRefresh();await refreshReports();refreshReviews();if(csrf&&task){const currentGeneration=task.generation;try{const calls=await api('/v1/tasks/'+id+'/calls');if(currentGeneration!==task.generation)return;document.getElementById('events').appendChild(elem('pre',JSON.stringify({remote_calls:calls},null,2)))}catch(e){document.getElementById('error').textContent=e.message}}};
document.getElementById('refresh').onclick=refresh;refresh();setInterval(()=>{if(csrf)refresh()},3000);
</script></body></html>
