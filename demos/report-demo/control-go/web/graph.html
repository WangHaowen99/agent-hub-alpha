<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>年报协作图</title>
<style>body{margin:0;padding:18px;background:#f4f7fb;color:#182538;font:14px/1.6 system-ui,sans-serif}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:20px;margin:0}small{color:#60718a}.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:18px}.node{background:white;border:1px solid #dbe3ef;border-radius:12px;padding:14px}.state{font:12px ui-monospace,monospace;color:#315d99}.committed{border-top:3px solid #22836c}.waiting{border-top:3px solid #c18c2f}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}button{background:#244f9c;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}#error{color:#a83333}details{margin-top:10px}</style></head>
<body><header><div><h1>公开年报 · 专家协作</h1><small id="summary">等待工具返回已检查的候选图</small></div><button id="confirm" hidden>打开确认与报告页 ↗</button></header><p id="error" role="alert"></p><section class="nodes" id="nodes"></section><small>状态来自 Go 正式记录。计算完成、检查通过、人工验收分别展示。</small>
<script>
// MCP Apps handshake adapted from WangHaowen99/rt77789 W05 app/bridge.ts.
// No execution or approval RPC is exposed to the assistant or this card.
const host=window.parent;let requestID=1;let current,viewGrant,liveURL,confirmURL;const pending=new Map();
function post(method,params){const id=requestID++;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(Error('MCP App host timeout'))},15000);pending.set(id,m=>{clearTimeout(timer);m.error?reject(Error(m.error.message||method)):resolve(m.result)});host.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function notify(method,params){host.postMessage({jsonrpc:'2.0',method,params},'*')}
function text(tag,value){const n=document.createElement(tag);n.textContent=value;return n}
function render(task){current=task;document.getElementById('summary').textContent=`${task.task_id} · ${task.graph_revision} · ${task.status}${task.pause_requested?' · 已请求暂停':''}`;const grid=document.getElementById('nodes');grid.replaceChildren();for(const n of task.graph.nodes){const state=task.nodes[n.id];const card=text('article','');card.className='node '+(state.status==='COMMITTED'?'committed':'waiting');card.append(text('strong',`${n.role} · ${n.id}`),text('div',n.expert),text('div',`前驱：${(n.depends_on||[]).join('、')||'固定材料'}`),text('p',n.task));const badge=text('div',state.status);badge.className='state';card.append(badge);if(state.reason)card.append(text('p',state.reason));if(state.result){const d=document.createElement('details');d.append(text('summary',`正式产物 · ${state.result.valid?'当前有效':'待复核'}`),text('pre',JSON.stringify(state.result.output,null,2)));card.append(d)}grid.append(card)}notify('ui/notifications/size-changed',{width:window.innerWidth,height:document.documentElement.scrollHeight})}
window.addEventListener('message',event=>{if(event.source!==host||event.data?.jsonrpc!=='2.0')return;const m=event.data;if(m.method===undefined&&m.id!==undefined){pending.get(m.id)?.(m);pending.delete(m.id);return}if(m.method==='ui/notifications/tool-result'){const result=m.params;const data=result?.structuredContent;if(data?.task){liveURL=data.projection_url;confirmURL=data.confirm_url;viewGrant=result._meta?.report_view_authorization;render(data.task);document.getElementById('confirm').hidden=false}}else if(m.id!==undefined&&m.method){host.postMessage({jsonrpc:'2.0',id:m.id,result:{}},'*')}});
document.getElementById('confirm').onclick=()=>post('ui/open-link',{url:confirmURL}).catch(e=>{document.getElementById('error').textContent=e.message});
setInterval(async()=>{if(!liveURL||!viewGrant)return;try{const res=await fetch(liveURL,{headers:{Authorization:`ReportView ${viewGrant}`},cache:'no-store',credentials:'omit'});if(!res.ok)throw Error('读取状态失败；请在对话中重新查询任务以刷新授权');render(await res.json());document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent=String(e.message)}},2000);
post('ui/initialize',{appInfo:{name:'annual-report-graph',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>notify('ui/notifications/initialized',{})).catch(e=>{document.getElementById('error').textContent=e.message});
</script></body></html>
