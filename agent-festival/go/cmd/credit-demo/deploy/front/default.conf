# 演示入口（5192）：WorkSwarm 页面 + /credit/ 下的授信编排服务，同一个源。
# 公网只放行这一个端口，出口带宽也小，所以文本资源一律 gzip。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    client_max_body_size 50m;

    # WorkSwarm 的 MCP App 沙箱代理页只接受 localhost/127.0.0.1 的宿主页面，从公网 IP 打开时卡片会被拒。
    # 让沙箱地址接口返回 404，前端就按它自带的退化路径用 srcdoc iframe 装 App。
    location = /api/v1/mcp-app/sandbox {
        return 404;
    }

    # 授信编排服务只开放给浏览器用的部分：页面、静态资源、只读图数据、卡片内批准（要密码）。
    # 执行器协议（/exec）、成员数据工具、MCP 和调试接口只在容器网络里用，不经这里出去。
    location /credit/ui/ {
        proxy_pass http://credit:8091/ui/;
        proxy_set_header Host $host;
    }
    location /credit/static/ {
        proxy_pass http://credit:8091/static/;
    }
    location = /credit/api/graph {
        proxy_pass http://credit:8091/api/graph;
    }
    location = /credit/api/approve {
        proxy_pass http://credit:8091/api/approve;
    }
    location /credit/ {
        return 404;
    }

    location / {
        proxy_pass http://swarm:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
