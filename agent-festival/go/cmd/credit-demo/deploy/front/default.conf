# 演示入口（5192）：只有 WorkSwarm（含编排协作台插件）。
# 公网只放行这一个端口，出口带宽也小，所以文本资源一律 gzip。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    client_max_body_size 50m;

    # 编排服务不经这里对外：浏览器只到 WorkSwarm，编排协作台由 WorkSwarm 插件在服务端调编排服务。
    location / {
        proxy_pass http://swarm:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
