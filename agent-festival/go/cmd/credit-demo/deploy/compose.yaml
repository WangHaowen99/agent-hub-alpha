# 授信编排演示：WorkSwarm（编排助手）+ credit（Go，agent-festival 内核）+ orchestrator（Java 执行器）。
# 独立项目名、独立数据卷，只监听本机端口：入口 5192（WorkSwarm，含编排协作台插件），调试用 5191 直连授信编排服务。
name: credit-demo
services:
  credit:
    image: credit-demo/credit:${CREDIT_TAG:-dev}
    environment:
      CREDIT_ORCHESTRATOR_URL: http://orchestrator:8195
      CREDIT_MEMBER_MCP_URL: http://credit:8091/member-mcp
      CREDIT_MODEL: ${CREDIT_MODEL:-qwen-plus}
      CREDIT_LEASE_SECONDS: ${CREDIT_LEASE_SECONDS:-20}
      CREDIT_BANK_SCENARIO: ${CREDIT_BANK_SCENARIO:-}
    volumes:
      - credit-data:/data
    ports:
      - "127.0.0.1:${CREDIT_PORT:-5191}:8091"
    restart: unless-stopped
  orchestrator:
    image: credit-demo/orchestrator:${CREDIT_TAG:-dev}
    env_file:
      - ${AHA_SECRETS_DIR:-${HOME}/.config/aha-swarm}/secrets.env
    environment:
      CREDIT_URL: http://credit:8091
    mem_limit: 1500m
    restart: unless-stopped
  swarm:
    image: aha-swarm/workswarm:${SWARM_COMMIT:-b98ec8c7d}
    env_file:
      - ${AHA_SECRETS_DIR:-${HOME}/.config/aha-swarm}/secrets.env
    environment:
      FRONTEND_HOST: 0.0.0.0
      CREDIT_MCP_URL: http://credit:8091/mcp
      CREDIT_INTERNAL_URL: http://credit:8091
    volumes:
      - swarm-plugin-home:/root/.jiuwenswarm
      - ./configure.py:/usr/local/bin/aha-configure.py:ro
      # 编排协作台：WorkSwarm 应用插件，不改 WorkSwarm 源码。
      - ../workbench-plugin:/root/.jiuwenswarm/domain/application_plugins/credit-workbench:ro
    depends_on:
      - credit
    restart: unless-stopped
  front:
    image: nginx:alpine
    volumes:
      - ./front:/etc/nginx/conf.d:ro
    ports:
      - "127.0.0.1:${CREDIT_SWARM_PORT:-5192}:80"
    depends_on:
      - swarm
      - credit
    restart: unless-stopped
volumes:
  credit-data:
  swarm-plugin-home:
