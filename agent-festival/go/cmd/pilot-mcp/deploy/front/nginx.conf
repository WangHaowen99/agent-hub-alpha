# 企业版前端的 API 根是 /gateway-api：Manager 把它直接转给 Gateway（WebChannel，19000）的 /api。
# 不能经 WorkSwarm Web 静态服务（5173）的 /api 代理：那里会读完整个响应再转发，流式回复会被截住。
# 用 Docker 内置 DNS 运行时解析 swarm，容器重建换 IP 后不必重启 nginx。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $swarm http://swarm:5173;
    set $gateway http://swarm:19000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 50m;

    location /gateway-api/ {
        rewrite ^/gateway-api/(.*)$ /api/$1 break;
        proxy_pass $gateway;
    }
    location / {
        proxy_pass $swarm;
    }
}
