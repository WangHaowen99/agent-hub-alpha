<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light; font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2328; }
  body { margin: 0; padding: 12px; background: #fff; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 2px; color: #6b737c; font-size: 12px; }
  input, select { font: inherit; padding: 4px 6px; border: 1px solid #d0d7de; border-radius: 6px; width: 92px; }
  input[type=checkbox] { width: auto; }
  button { font: inherit; padding: 5px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; }
  button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  #cmd { margin: 10px 0; display: none; gap: 8px; align-items: center; flex-wrap: wrap; }
  #cmd code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; }
  .task { border: 1px solid #e3e6ea; border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .id { font-weight: 600; }
  .chip { padding: 1px 8px; border-radius: 10px; background: #eef0f3; }
  .ok { background: #dafbe1; color: #1a7f37; } .wait { background: #fff4d6; color: #9a6700; }
  .unknown { background: #fff4d6; color: #9a6700; font-weight: 600; } .bad { background: #ffebe9; color: #cf222e; }
  .muted { color: #6b737c; font-size: 12px; }
</style>
</head>
<body>
<form id="f">
  <label>客户<input name="customer_id" value="C001"></label>
  <label>资产（万元）<input name="assets_wan" type="number" value="3500"></label>
  <label>最长逾期（月）<input name="longest_overdue_months" type="number" value="0"></label>
  <label>最近逾期（月前）<input name="latest_overdue_months_ago" type="number" value="0"></label>
  <label>资产报告<input name="asset_report_ok" type="checkbox" checked></label>
  <label>业务方行为<select name="scenario">
    <option value="normal">正常</option><option value="decline">拒绝</option>
    <option value="timeout">超时</option><option value="lost_receipt">丢回执</option>
    <option value="duplicate_receipt">重复回执</option></select></label>
  <button class="primary">提交申请</button>
</form>
<div id="cmd" class="row"><code id="cmdid"></code><button id="resend" type="button">重发同一命令</button><button id="tamper" type="button">同号改资产重发</button><span id="receipt"></span></div>
<div id="tasks"></div>
<!--SCRIPT-->
</body>
</html>
